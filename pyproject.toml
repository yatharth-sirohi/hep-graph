[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hep-graph"
version = "0.1.0"
description = "A bounded, read-only HEP researcher connection graph"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "networkx==3.5",
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hepgraph*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.vercel]
entrypoint = "hepgraph.server:Handler"
